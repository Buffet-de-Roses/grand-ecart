<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grand écart">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Grand écart</title>
</head>
<body>
  <main id="app">
    <header>
      <span id="progress"></span>
      <h1 id="name"></h1>
    </header>

    <section id="stage">
      <img id="photo" alt="">
      <div id="fallback" hidden></div>
      <button id="timer" aria-label="Lancer ou mettre en pause le timer">
        <span id="time">00:00</span>
        <small id="hint">Touchez pour lancer</small>
      </button>
    </section>

    <p id="tip"></p>

    <nav>
      <button id="prev" aria-label="Exercice précédent">‹ Précédent</button>
      <button id="next" aria-label="Exercice suivant">Suivant ›</button>
    </nav>
  </main>

  <section id="done" hidden>
    <h1>Séance terminée 🎉</h1>
    <p>Bien joué, pensez à respirer calmement.</p>
    <button id="restart">Recommencer</button>
  </section>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
